name: Deploy to GitHub Pages

on:
  push:
    # master         = 原始主线（不动）
    # workbuddy-edition = 单人练习（PVE）分支：让该分支也能自行发布到 Pages，
    #   这样不必先合并到 master 就能在线验收（Pages 每个仓库只有一个站点，后发布者生效）。
    #
    # ⚠️ **刻意不含 `main`**：本仓库的 `main` 只是 2026-09-11 在 GitHub 网页 UI 上做的
    #    初始提交（b093158 "Fix HTML encoding issues in index.html"），与 master 毫无关系、
    #    此后从未被推送过。它留在触发列表里等于埋了个雷 —— 哪天误往 main 推东西会**直接上线**。
    #    2026-10-10 移除；要恢复请先确认 main 真的承担了发布职责。
    branches: [master, workbuddy-edition]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 7 秒就能跑完，放在最前面：风格/明显错误不通过时不必再花 5 分钟跑单测与打包
      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # 产物使用相对 base('./')：挂在任意 GitHub Pages 子路径下都能加载，
      # 因此不再注入 VITE_BASE（也避免 Windows/Git Bash 把 "/repo/" 转成 C:/Program Files/... 造成白屏）
      - name: Build (GitHub Pages)
        run: pnpm build

      - name: Show build output
        run: |
          echo "repository: ${{ github.repository }}"
          head -20 dist/index.html

      # 把 dist 也作为 artifact 传给 e2e job —— 保证 E2E 跑的就是"将要部署的同一份字节"
      - name: Upload dist (for e2e)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # E2E 质量门：本 job 失败则 deploy 被 skip（这就是"阻塞部署"）。
  # 阻塞门内容 = local + mobile + preview 的离线部分（--grep-invert @network），共 67 条。
  # preview 里依赖公共信令的 2 条另跑一步（continue-on-error）——覆盖还在、结果可见，
  # 但不会因为公共 MQTT 抖动而卡住上线。
  e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E（阻塞门：local + mobile + preview 离线）
        run: pnpm e2e:ci

      - name: E2E（公共信令，非阻塞）
        continue-on-error: true
        run: pnpm e2e:preview:net

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
