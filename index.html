<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回合制战略 · P2P 联机</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1117; color: #e8eaed;
    display: flex; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .app { width: 100%; max-width: 560px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #8a8f98; margin-bottom: 24px; }
  .panel {
    background: #181b23; border: 1px solid #262a35;
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .panel h2 { font-size: 14px; font-weight: 600; color: #a0a6b0; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  label { display: block; font-size: 13px; color: #8a8f98; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #2d3340; background: #0f1117;
    color: #e8eaed; font-size: 14px; outline: none;
  }
  input:focus { border-color: #4a6cf7; }
  input::placeholder { color: #5a5f6a; }
  button {
    width: 100%; padding: 11px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s; margin-top: 12px;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: #4a6cf7; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #3b5ce0; }
  .btn-success { background: #22c55e; color: #052e16; }
  .btn-success:hover:not(:disabled) { background: #1ea34d; }
  .btn-ghost { background: transparent; border: 1px solid #2d3340; color: #a0a6b0; }
  .btn-ghost:hover:not(:disabled) { border-color: #4a6cf7; color: #e8eaed; }
  .share-box {
    margin-top: 12px; padding: 10px 12px; background: #0f1117;
    border: 1px solid #2d3340; border-radius: 8px;
    font-size: 12px; color: #8a8f98; word-break: break-all;
  }
  .share-box strong { color: #4a6cf7; }
  .player-list { list-style: none; }
  .player-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 8px; background: #0f1117;
    margin-bottom: 8px; border: 1px solid #1e222b;
  }
  .player-item.me { border-color: #4a6cf7; }
  .player-name { font-size: 14px; }
  .player-tag { font-size: 11px; color: #5a5f6a; margin-left: 6px; }
  .status { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .status.ready { background: #14532d; color: #86efac; }
  .status.not-ready { background: #3f1d1d; color: #fca5a5; }
  .status.host { background: #1e3a5f; color: #93c5fd; }
  .empty-state { font-size: 13px; color: #5a5f6a; text-align: center; padding: 12px; }
  .hidden { display: none; }
  .hint { font-size: 12px; color: #5a5f6a; margin-top: 10px; line-height: 1.6; }
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #1e222b; border: 1px solid #2d3340; color: #e8eaed;
    padding: 10px 20px; border-radius: 8px; font-size: 13px;
    z-index: 100; transition: opacity 0.3s;
  }
</style>
</head>
<body>
<div class="app">

  <!-- 加入界面 -->
  <div id="view-join">
    <h1>回合制战略</h1>
    <p class="subtitle">P2P 联机 · 房主权威 · 无需服务器</p>

    <div class="panel">
      <h2>加入房间</h2>
      <label for="input-name">你的昵称</label>
      <input id="input-name" type="text" placeholder="输入昵称" maxlength="16" autocomplete="off">
      <label for="input-room" style="margin-top: 14px;">房间码</label>
      <input id="input-room" type="text" placeholder="输入房间码，或留空创建新房间" maxlength="32" autocomplete="off">
      <button id="btn-join" class="btn-primary">加入 / 创建房间</button>
      <p class="hint">
        房主创建房间后，把页面链接分享给好友。<br>
        好友打开链接即自动填入房间码，只需输入昵称。
      </p>
    </div>
  </div>

  <!-- 房间界面 -->
  <div id="view-room" class="hidden">
    <h1>房间大厅</h1>
    <p class="subtitle" id="room-label">房间码：—</p>

    <div class="panel">
      <h2>玩家</h2>
      <ul id="player-list" class="player-list">
        <li class="empty-state">等待玩家加入…</li>
      </ul>
      <div id="share-box" class="share-box hidden">
        分享链接：<strong id="share-url"></strong>
      </div>
    </div>

    <div class="panel">
      <button id="btn-ready" class="btn-ghost">准备</button>
      <button id="btn-start" class="btn-success hidden" disabled>开始游戏</button>
      <p class="hint" id="host-hint"></p>
    </div>

    <button id="btn-leave" class="btn-ghost">离开房间</button>
  </div>

</div>

<script type="module">
import { joinRoom } from 'https://esm.run/trystero/torrent'

/* ============================================================
   配置区
   ============================================================ */

// 独一无二的应用标识。上线前改成你自己的，例如 'yourname-tbs-2026'
const APP_ID = 'tbs-p2p-demo-001'

// 房间码字符集（去掉容易混淆的 0/O/1/I/L）
const ROOM_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'

// 状态
const state = {
  room: null,
  selfId: null,
  isHost: false,
  myName: '',
  myReady: false,
  // peerId -> { name, ready, isHost }
  players: {},
  // 房主用于判定“第一个进入者”的标记
  hostClaimed: false,
}

/* ============================================================
   DOM 引用
   ============================================================ */
const $ = id => document.getElementById(id)
const viewJoin = $('view-join')
const viewRoom = $('view-room')
const inputName = $('input-name')
const inputRoom = $('input-room')
const btnJoin = $('btn-join')
const btnReady = $('btn-ready')
const btnStart = $('btn-start')
const btnLeave = $('btn-leave')
const playerList = $('player-list')
const roomLabel = $('room-label')
const shareBox = $('share-box')
const shareUrl = $('share-url')
const hostHint = $('host-hint')

/* ============================================================
   工具函数
   ============================================================ */
function generateRoomCode (len = 6) {
  let s = ''
  const arr = new Uint8Array(len)
  crypto.getRandomValues(arr)
  for (let i = 0; i < len; i++) s += ROOM_CHARS[arr[i] % ROOM_CHARS.length]
  return s
}

function normalizeRoomCode (raw) {
  return String(raw || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '')
}

function toast (msg, ms = 2200) {
  const el = document.createElement('div')
  el.className = 'toast'
  el.textContent = msg
  document.body.appendChild(el)
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300) }, ms)
}

// 从 URL ?room=XXX 读取房间码
const urlParams = new URLSearchParams(location.search)
const urlRoom = normalizeRoomCode(urlParams.get('room'))
if (urlRoom) inputRoom.value = urlRoom

// 昵称记忆
const savedName = localStorage.getItem('tbs-name')
if (savedName) inputName.value = savedName

/* ============================================================
   Trystero Action 通道
   ============================================================ */
let sendPlayerInfo
let sendReadyState
let sendGameStart

/* ============================================================
   加入 / 创建房间
   ============================================================ */
btnJoin.addEventListener('click', () => {
  const name = inputName.value.trim()
  if (!name) { toast('请先输入昵称'); inputName.focus(); return }

  const roomCode = normalizeRoomCode(inputRoom.value) || generateRoomCode()
  localStorage.setItem('tbs-name', name)
  state.myName = name

  // 记录房间码到 URL，方便分享
  const url = new URL(location.href)
  url.searchParams.set('room', roomCode)
  history.replaceState(null, '', url.toString())

  joinGameRoom(roomCode)
})

function joinGameRoom (roomCode) {
  btnJoin.disabled = true
  btnJoin.textContent = '连接中…'

  const room = joinRoom({ appId: APP_ID }, roomCode)
  state.room = room
  state.selfId = room.selfId

  // 创建数据通道
  const [sendInfo, getInfo] = room.makeAction('playerInfo')
  const [sendReady, getReady] = room.makeAction('readyState')
  const [sendStart, getStart] = room.makeAction('gameStart')
  sendPlayerInfo = sendInfo
  sendReadyState = sendReady
  sendGameStart = sendStart

  // 收到玩家信息
  getInfo((data, peerId) => {
    state.players[peerId] = {
      name: data.name,
      ready: data.ready || false,
      isHost: data.isHost || false,
    }
    renderPlayers()
  })

  // 收到准备状态变更
  getReady((data, peerId) => {
    if (state.players[peerId]) {
      state.players[peerId].ready = data.ready
      renderPlayers()
    }
  })

  // 收到开始游戏
  getStart(() => {
    onGameStart()
  })

  // 有人加入
  room.onPeerJoin(peerId => {
    // 房主负责维护权威玩家列表
    if (state.isHost) {
      // 房主把自己的信息发给新玩家
      sendPlayerInfo({
        name: state.myName,
        ready: state.myReady,
        isHost: true,
      }, peerId)

      // 房主把当前所有已知玩家的信息发给新玩家
      Object.entries(state.players).forEach(([pid, p]) => {
        if (pid !== peerId) {
          sendPlayerInfo({ name: p.name, ready: p.ready, isHost: p.isHost }, peerId)
        }
      })
    } else {
      // 普通玩家把自己的信息发给所有人
      sendPlayerInfo({
        name: state.myName,
        ready: state.myReady,
        isHost: false,
      })
    }
  })

  // 有人离开
  room.onPeerLeave(peerId => {
    delete state.players[peerId]
    renderPlayers()
    // 如果房主离开，普通玩家提示
    if (state.players[peerId]?.isHost) {
      toast('房主已离开，游戏暂停')
    }
  })

  // 切换视图
  viewJoin.classList.add('hidden')
  viewRoom.classList.remove('hidden')
  roomLabel.textContent = `房间码：${roomCode}`

  // 判定房主：如果房间里还没有其他人，你就是房主
  // Trystero 的 getPeers() 返回当前已连接的 peer 映射
  setTimeout(() => {
    const peers = room.getPeers()
    const isFirst = Object.keys(peers).length === 0

    if (isFirst && !state.hostClaimed) {
      state.isHost = true
      state.hostClaimed = true
      state.players[state.selfId] = {
        name: state.myName,
        ready: false,
        isHost: true,
      }
      hostHint.textContent = '你是房主，等待好友加入后点击开始'
      shareBox.classList.remove('hidden')
      shareUrl.textContent = location.href
      btnStart.classList.remove('hidden')
    } else {
      state.players[state.selfId] = {
        name: state.myName,
        ready: false,
        isHost: false,
      }
      hostHint.textContent = '等待房主开始游戏'
    }

    renderPlayers()
    btnJoin.disabled = false
    btnJoin.textContent = '加入 / 创建房间'
  }, 800)
}

/* ============================================================
   准备 / 开始 / 离开
   ============================================================ */
btnReady.addEventListener('click', () => {
  state.myReady = !state.myReady
  state.players[state.selfId].ready = state.myReady

  sendReadyState({ ready: state.myReady })

  btnReady.textContent = state.myReady ? '取消准备' : '准备'
  btnReady.className = state.myReady ? 'btn-success' : 'btn-ghost'

  renderPlayers()
  updateStartButton()
})

btnStart.addEventListener('click', () => {
  if (!state.isHost) return
  sendGameStart({})
  onGameStart()
})

btnLeave.addEventListener('click', () => {
  state.room?.leave()
  location.href = location.pathname
})

function onGameStart () {
  toast('游戏开始！')
  // 这里后续接入你的游戏场景
  // 目前先简单提示
  viewRoom.innerHTML = `
    <h1>游戏进行中</h1>
    <p class="subtitle">M1 联机骨架已跑通。接下来把游戏逻辑接进来即可。</p>
    <div class="panel">
      <h2>当前玩家</h2>
      <ul class="player-list">
        ${Object.entries(state.players).map(([id, p]) => `
          <li class="player-item">
            <span class="player-name">${escapeHtml(p.name)}${id === state.selfId ? '<span class="player-tag">(你)</span>' : ''}</span>
            <span class="status ${p.isHost ? 'host' : 'ready'}">${p.isHost ? '房主' : '玩家'}</span>
          </li>
        `).join('')}
      </ul>
    </div>
  `
}

/* ============================================================
   渲染
   ============================================================ */
function renderPlayers () {
  const entries = Object.entries(state.players)
  if (entries.length === 0) {
    playerList.innerHTML = '<li class="empty-state">等待玩家加入…</li>'
    return
  }

  playerList.innerHTML = entries.map(([id, p]) => {
    const isMe = id === state.selfId
    const statusClass = p.isHost ? 'host' : (p.ready ? 'ready' : 'not-ready')
    const statusText = p.isHost ? '房主' : (p.ready ? '已准备' : '未准备')
    return `
      <li class="player-item ${isMe ? 'me' : ''}">
        <span class="player-name">${escapeHtml(p.name)}${isMe ? '<span class="player-tag">(你)</span>' : ''}</span>
        <span class="status ${statusClass}">${statusText}</span>
      </li>
    `
  }).join('')

  updateStartButton()
}

function updateStartButton () {
  if (!state.isHost) return
  const others = Object.entries(state.players).filter(([id]) => id !== state.selfId)
  const allReady = others.length > 0 && others.every(([, p]) => p.ready)
  btnStart.disabled = !allReady
  btnStart.textContent = allReady ? '开始游戏' : `等待玩家准备 (${others.filter(([, p]) => p.ready).length}/${others.length})`
}

function escapeHtml (s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]))
}
</script>
</body>
</html>
